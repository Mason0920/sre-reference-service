apiVersion: apps/v1
kind: Deployment
metadata:
  name: hslee
  labels:
    app: hslee
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hslee
  template:
    metadata:
      labels:
        app: hslee
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: hslee
          image: ghcr.io/hslee/hslee:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hslee-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
