apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hslee-staging

resources:
  - ../../base
  - namespace.yaml
  - configmap.yaml

images:
  - name: ghcr.io/hslee/hslee
    newTag: latest

replicas:
  - name: hslee
    count: 2

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
    target:
      kind: Deployment
      name: hslee
