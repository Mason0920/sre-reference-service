apiVersion: 1

providers:
  - name: hslee-traces-dashboards
    orgId: 1
    folder: Distributed Tracing
    folderUid: hslee-traces
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards/traces
      foldersFromFilesStructure: false
