name: Weekly Security Scan

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at 00:00 UTC
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── Scan latest published GHCR image ─────────────────────────────────────────
  trivy-latest:
    name: Scan Latest GHCR Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Compute image reference
        id: vars
        run: echo "image_ref=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan on latest published image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.vars.outputs.image_ref }}
          format: json
          output: trivy-weekly-results.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
          ignore-unfixed: false

      - name: Upload weekly scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-weekly-${{ github.run_id }}
          path: trivy-weekly-results.json
          if-no-files-found: warn
          retention-days: 90
