apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # ── Slack service ─────────────────────────────────────────────────────────────
  service.slack: |
    token: $slack-token

  # ── Notification templates ────────────────────────────────────────────────────
  template.app-sync-succeeded: |
    slack:
      attachments: |
        [{
          "color": "good",
          "title": ":white_check_mark: {{.app.metadata.name}} synced successfully",
          "fields": [
            {"title": "Application", "value": "{{.app.metadata.name}}", "short": true},
            {"title": "Environment", "value": "{{if contains \"staging\" .app.metadata.name}}staging{{else}}production{{end}}", "short": true},
            {"title": "Revision", "value": "{{.app.status.sync.revision | substr 0 7}}", "short": true},
            {"title": "Status", "value": "{{.app.status.health.status}}", "short": true}
          ],
          "footer": "ArgoCD",
          "ts": {{now | unixEpoch}}
        }]

  template.app-sync-failed: |
    slack:
      attachments: |
        [{
          "color": "danger",
          "title": ":rotating_light: {{.app.metadata.name}} sync FAILED",
          "fields": [
            {"title": "Application", "value": "{{.app.metadata.name}}", "short": true},
            {"title": "Environment", "value": "{{if contains \"staging\" .app.metadata.name}}staging{{else}}production{{end}}", "short": true},
            {"title": "Revision", "value": "{{.app.status.sync.revision | substr 0 7}}", "short": true},
            {"title": "Message", "value": "{{range .app.status.conditions}}{{.message}}{{end}}", "short": false}
          ],
          "footer": "ArgoCD",
          "ts": {{now | unixEpoch}}
        }]

  template.app-health-degraded: |
    slack:
      attachments: |
        [{
          "color": "warning",
          "title": ":warning: {{.app.metadata.name}} health degraded",
          "fields": [
            {"title": "Application", "value": "{{.app.metadata.name}}", "short": true},
            {"title": "Health", "value": "{{.app.status.health.status}}", "short": true},
            {"title": "Message", "value": "{{.app.status.health.message}}", "short": false}
          ],
          "footer": "ArgoCD",
          "ts": {{now | unixEpoch}}
        }]

  # ── Triggers ──────────────────────────────────────────────────────────────────
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-sync-succeeded]

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

  # ── Default subscriptions ─────────────────────────────────────────────────────
  defaultTriggers: |
    - on-sync-succeeded
    - on-sync-failed
    - on-health-degraded
---
# Secret for Slack token — populate via sealed-secrets or external-secrets
# kubectl create secret generic argocd-notifications-secret \
#   -n argocd --from-literal=slack-token=<xoxb-your-slack-bot-token>
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  # Replace with actual Slack bot token (xoxb-...)
  slack-token: REPLACE_WITH_SLACK_BOT_TOKEN
