apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hslee-production
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: deployments
spec:
  project: default

  source:
    # Replace with your actual GitHub repository URL
    repoURL: https://github.com/hslee/hslee.git
    targetRevision: main
    path: k8s/overlays/production

  destination:
    # Replace with production EKS cluster API server URL
    # Register with: argocd cluster add <production-context> --name production
    server: https://PRODUCTION_CLUSTER_API_SERVER
    namespace: hslee-production

  # No syncPolicy.automated — production requires manual promotion via ArgoCD UI
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
