apiVersion: v1
kind: ConfigMap
metadata:
  name: hslee-config
  namespace: production
  labels:
    app: hslee
    environment: production
data:
  APP_ENV: "production"
  LOG_LEVEL: "warn"
  LISTEN_ADDR: ":8080"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "hslee"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
