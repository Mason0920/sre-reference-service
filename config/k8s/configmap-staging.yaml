apiVersion: v1
kind: ConfigMap
metadata:
  name: hslee-config
  namespace: staging
  labels:
    app: hslee
    environment: staging
data:
  APP_ENV: "staging"
  LOG_LEVEL: "info"
  LISTEN_ADDR: ":8080"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "hslee"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
